name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/build-android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle distributions and dependencies
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm install

      - name: Prepare web app
        run: |
          mkdir -p www
          cp index.html manifest.webmanifest sw.js www/

      - name: Create Android project
        run: npx cap add android

      - name: Sync app
        run: npx cap sync android

      - name: Configure reliable Gradle download
        run: |
          # Use the smaller binary distribution and allow slow runner downloads.
          sed -i 's/gradle-8.11.1-all.zip/gradle-8.11.1-bin.zip/' android/gradle/wrapper/gradle-wrapper.properties
          if grep -q '^networkTimeout=' android/gradle/wrapper/gradle-wrapper.properties; then
            sed -i 's/^networkTimeout=.*/networkTimeout=120000/' android/gradle/wrapper/gradle-wrapper.properties
          else
            echo 'networkTimeout=120000' >> android/gradle/wrapper/gradle-wrapper.properties
          fi

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew

          # setup-gradle restores the distribution ZIP into the wrapper cache.
          # Unpack it ourselves so Gradle does not try the failing GitHub redirect again.
          ZIP="$(find "$HOME/.gradle/wrapper/dists/gradle-8.11.1-bin" -type f -name 'gradle-8.11.1-bin.zip' -print -quit 2>/dev/null || true)"
          if [ -n "$ZIP" ]; then
            DIST_DIR="$(dirname "$ZIP")/gradle-8.11.1"
            if [ ! -x "$DIST_DIR/bin/gradle" ]; then
              echo "Using cached Gradle distribution: $ZIP"
              unzip -q "$ZIP" -d "$(dirname "$ZIP")"
            fi
            "$DIST_DIR/bin/gradle" --no-daemon assembleDebug
          else
            echo "Cached Gradle ZIP not found; using the Gradle wrapper."
            ./gradlew --no-daemon assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: A3-MISSION-2027-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
